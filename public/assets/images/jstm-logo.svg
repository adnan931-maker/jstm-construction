<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="920" height="280" fill="none">
  <defs>
    <linearGradient id="emeraldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="emeraldDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#024e35" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1322" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="920" height="280" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Architectural Blueprint Drafting Grid in Emblem Area -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="40" y1="35" x2="270" y2="35" />
    <line x1="40" y1="75" x2="270" y2="75" />
    <line x1="40" y1="115" x2="270" y2="115" />
    <line x1="40" y1="155" x2="270" y2="155" />
    <line x1="40" y1="195" x2="270" y2="195" />
    <line x1="40" y1="235" x2="270" y2="235" />
    <line x1="60" y1="20" x2="60" y2="260" />
    <line x1="100" y1="20" x2="100" y2="260" />
    <line x1="140" y1="20" x2="140" y2="260" />
    <line x1="180" y1="20" x2="180" y2="260" />
    <line x1="220" y1="20" x2="220" y2="260" />
  </g>

  <!-- ================= MONUMENTAL CAPITAL 'J' EMBLEM ================= -->
  <g transform="translate(68, 38)">
    <!-- Ambient Green Radiance -->
    <circle cx="95" cy="100" r="60" fill="#10B981" opacity="0.16" filter="url(#emeraldGlow)" />

    <!-- Isometric Structural Top Cap of Letter 'J' (Crossbar Anchor) -->
    <!-- Top Horizontal Cantilever Beam -->
    <polygon points="50,42 165,42 185,22 70,22" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <polygon points="165,42 185,22 185,34 165,54" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <!-- Emerald accent strip on crossbar top -->
    <line x1="72" y1="24" x2="183" y2="24" stroke="#34D399" stroke-width="2" opacity="0.8" />

    <!-- Left 3D Depth Extrusion for 'J' Vertical Shaft -->
    <path d="M125,42 L145,22 L145,130 C145,152 130,172 108,184 L92,168 C106,158 115,146 115,130 Z" fill="#047857" opacity="0.9" />

    <!-- Main Front Face of Monumental Capital 'J' -->
    <path d="M125,42 L165,42 L165,136 C165,166 142,192 108,198 C72,204 42,184 40,154 L75,148 C76,162 88,170 102,168 C116,166 125,152 125,136 Z" 
          fill="url(#emeraldGrad1)" />

    <!-- Architectural Drafting Cuts & Precision Bevels on 'J' -->
    <!-- Center Construction Truss Line running through J shaft -->
    <line x1="145" y1="48" x2="145" y2="135" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" opacity="0.6" />
    
    <!-- Isometric Facet Diagonal Sheen across J curve -->
    <polygon points="108,198 125,136 145,135 125,178" fill="#34D399" opacity="0.35" />

    <!-- Architectural Cross-Bracing Strut (Engineering Triangle) -->
    <polygon points="50,42 125,42 125,100" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" opacity="0.85" />
    <line x1="56" y1="42" x2="125" y2="95" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />

    <!-- Precision Drafting Nodes -->
    <circle cx="50" cy="42" r="3" fill="#34D399" />
    <circle cx="165" cy="42" r="3.5" fill="#FFFFFF" />
    <circle cx="165" cy="136" r="3" fill="#34D399" />
    <circle cx="108" cy="198" r="3.5" fill="#FFFFFF" />
    <circle cx="40" cy="154" r="3" fill="#34D399" />
  </g>

  <!-- Sleek Vertical Architectural Separator -->
  <line x1="305" y1="46" x2="305" y2="234" stroke="#1E293B" stroke-width="1.5" />
  <circle cx="305" cy="140" r="3.5" fill="#10B981" />
  <circle cx="305" cy="140" r="7" stroke="#10B981" stroke-width="1" opacity="0.4" />

  <!-- ================= TYPOGRAPHY & BRAND WORDMARK ================= -->
  <g transform="translate(345, 0)">
    <!-- Primary Acronym: JSTM with Capital J emphasized -->
    <text x="0" y="124" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" letter-spacing="4" fill="#FFFFFF">
      <tspan fill="#34D399">J</tspan>STM
    </text>

    <!-- Refined Architectural Pill: LONDON -->
    <g transform="translate(230, 75)">
      <rect x="0" y="0" width="108" height="30" rx="6" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1.2" />
      <circle cx="15" cy="15" r="3.5" fill="#34D399" />
      <text x="28" y="20.5" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="12" letter-spacing="3" fill="#34D399">
        LONDON
      </text>
    </g>

    <!-- Subtitle: Professional Discipline -->
    <text x="3" y="162" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14.5" letter-spacing="5" fill="#94A3B8">
      CONSTRUCTION &amp; REFURBISHMENT
    </text>

    <!-- High-End Accreditation & Division Baseline -->
    <text x="3" y="192" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" letter-spacing="2.5" fill="#64748B">
      PRIME RESIDENTIAL • STRUCTURAL ENGINEERING • MAYFAIR HQ
    </text>
  </g>
</svg>